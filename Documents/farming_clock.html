let fetchedQuotes = [];
let isFetching = false;
let cycleTimer, progressInterval, cycleStartTime;

async function fetchQuotes() {
  if (isFetching) return;
  isFetching = true;
  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: 'You are a curator of inspiring quotes about farming, agriculture, and the land. Return ONLY a JSON array of 6 quotes. Each quote must be a JSON object with "text" (the quote) and "attr" (speaker/source). No markdown, no explanation, just raw JSON array.',
        messages: [{ role: 'user', content: 'Give me 6 inspirational quotes about farming and the land. JSON array only.' }]
      })
    });
    const data = await resp.json();
    const raw = data.content?.find(b => b.type === 'text')?.text || '[]';
    const parsed = JSON.parse(raw.replace(/```json|```/g, '').trim());
    if (Array.isArray(parsed) && parsed.length) fetchedQuotes.push(...parsed);
  } catch(e) {}
  isFetching = false;
}

function typeText(el, text, cursorEl, onDone) {
  el.textContent = '';
  el.appendChild(cursorEl);
  cursorEl.classList.remove('hidden');
  let i = 0;
  const speed = Math.max(18, Math.min(55, Math.round(1200 / text.length)));
  function next() {
    if (i < text.length) {
      el.insertBefore(document.createTextNode(text[i]), cursorEl);
      i++;
      setTimeout(next, speed);
    } else {
      cursorEl.classList.add('hidden');
      if (onDone) onDone();
    }
  }
  next();
}

function updateClock() {
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  document.getElementById('digitalTime').textContent =
    pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
}

function startCycle() {
  clearTimeout(cycleTimer);
  clearInterval(progressInterval);

  const q = getNextQuote();
  document.getElementById('attribution').textContent = '';
  const quoteEl = document.getElementById('quoteText');
  const cursor  = document.getElementById('cursor');

  typeText(quoteEl, q.text, cursor, () => {
    document.getElementById('attribution').textContent = '— ' + q.attr;
  });

  cycleStartTime = Date.now();
  document.getElementById('statusText').textContent = 'Tending the fields...';

  progressInterval = setInterval(() => {
    const pct = Math.min(100, ((Date.now() - cycleStartTime) / CYCLE) * 100);
    document.getElementById('progressFill').style.width = pct + '%';
  }, 100);

  cycleTimer = setTimeout(() => {
    clearInterval(progressInterval);
    document.getElementById('progressFill').style.width = '0%';
    document.getElementById('statusText').textContent = 'New wisdom growing...';
    if (fetchedQuotes.length < 4 && !isFetching) fetchQuotes();
    setTimeout(startCycle, 400);
  }, CYCLE);
}

// ── MP3 music player ─────────────────────────────────────────────────────
let musicPlaying = false;
let audio = null;

function buildAudio() {
  audio = document.getElementById('bgAudio');
  audio.volume = 0.75;
  audio.loop = true;
  audio.addEventListener('error', (e) => {
    console.error('Audio error:', e, audio.error);
    document.getElementById('musicBtn').title = 'Audio error: ' + (audio.error ? audio.error.message : 'unknown');
  });
}

function startMusic() {
  if (!audio) buildAudio();
  const p = audio.play();
  if (p !== undefined) {
    p.then(() => {
      musicPlaying = true;
      document.getElementById('musicBtn').textContent = '⏸';
    }).catch(err => {
      console.error('Play failed:', err);
      document.getElementById('musicBtn').title = 'Play failed: ' + err.message;
    });
  }
}

function stopMusic() {
  if (!audio) return;
  audio.pause();
  musicPlaying = false;
  document.getElementById('musicBtn').innerHTML = '&#9835;';
}

document.getElementById('musicBtn').addEventListener('click', () => {
  if (musicPlaying) stopMusic(); else startMusic();
});
